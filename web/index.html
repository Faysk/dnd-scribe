<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0c0f" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="O arquivo de sessões da campanha Yuhara." />
  <title>Arquivo Yuhara</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/library.css" />
</head>
<body>
  <a class="skip-link" href="#content">Pular para o conteúdo</a>

  <header class="site-header">
    <a class="brand" href="#/" aria-label="Arquivo Yuhara — início">
      <span class="brand-sigil" aria-hidden="true">Y</span>
      <span>
        <strong>Arquivo Yuhara</strong>
        <small>Memórias da campanha</small>
      </span>
    </a>

    <div class="header-actions">
      <span id="sessionIdentity" class="session-identity" hidden></span>
      <button id="signOutButton" class="text-button" type="button" hidden>Sair</button>
    </div>
  </header>

  <main id="content" tabindex="-1">
    <section id="app" class="app-view" aria-live="polite">
      <div class="loading-state">
        <span class="eyebrow">Arquivo da campanha</span>
        <h1>Abrindo as memórias…</h1>
        <div class="loading-line" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/library.js"></script>
</body>
</html>
