<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0c0f" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="DnD Scribe — sessões, transcrições e resumos da campanha." />
  <title>DnD Scribe</title>
  <link rel="icon" href="data:," />
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/library.css" />
</head>
<body>
  <a class="skip-link" href="#content">Pular para o conteúdo</a>

  <header class="site-header">
    <a class="brand" href="#/" aria-label="DnD Scribe — início">
      <span class="brand-sigil" aria-hidden="true">20</span>
      <span>
        <strong>DnD Scribe</strong>
        <small>Arquivo da campanha</small>
      </span>
    </a>

    <div class="header-actions">
      <button class="theme-toggle" type="button" data-theme-toggle>
        <span data-theme-icon aria-hidden="true">☾</span>
        <span data-theme-label>sistema</span>
      </button>
      <button id="userMenuButton" class="user-menu-button" type="button" hidden aria-expanded="false">
        <span id="sessionIdentity" class="session-identity"></span>
        <span aria-hidden="true">⌄</span>
      </button>
      <div id="userMenu" class="user-menu" hidden>
        <a href="#/">Sessões</a>
        <a id="editMenuLink" href="/edit/" hidden>Edit</a>
        <button id="signOutButton" type="button">Sair</button>
      </div>
    </div>
  </header>

  <main id="content" tabindex="-1">
    <section id="app" class="app-view" aria-live="polite">
      <div class="loading-state">
        <span class="eyebrow">Arquivo da campanha</span>
        <h1>Abrindo as memórias…</h1>
        <div class="loading-line" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/library.js"></script>
</body>
</html>
