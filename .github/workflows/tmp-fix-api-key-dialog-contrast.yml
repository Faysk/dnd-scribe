name: Temporary API key dialog contrast fix

on:
  push:
    branches:
      - fix/api-key-dialog-contrast

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/api-key-dialog-contrast
          fetch-depth: 0
      - name: Patch dialog form contrast
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/central-local/styles.css')
          text = path.read_text(encoding='utf-8')
          marker = '.review-dialog textarea { min-height: 180px; }'
          addition = ".review-dialog textarea { min-height: 180px; }\n.review-dialog input,\n.review-dialog textarea,\n.review-dialog select {\n  color: var(--ink);\n  caret-color: var(--ink);\n}\n.review-dialog input::placeholder,\n.review-dialog textarea::placeholder {\n  color: var(--muted);\n  opacity: .78;\n}\n.review-dialog select option {\n  color: var(--ink);\n  background: var(--paper);\n}"
          if addition not in text:
              if marker not in text:
                  raise SystemExit('dialog textarea marker not found')
              path.write_text(text.replace(marker, addition, 1), encoding='utf-8')
          PY
      - name: Commit fix when needed
        shell: bash
        run: |
          if git diff --quiet -- web/central-local/styles.css; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/central-local/styles.css
          git commit -m "fix(ui): keep API key dialog fields readable in dark theme"
          git push origin HEAD:fix/api-key-dialog-contrast
