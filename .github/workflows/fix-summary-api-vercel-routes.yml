name: Fix summary API Vercel routes

on:
  push:
    branches:
      - feat/summary-api-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/_fix_summary_api_vercel_routes.py
      - run: npm ci
      - run: npm run check:summary-api
      - run: npm run build
      - name: Commit route bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/summary-api.js vercel.json tools/check_summary_api_guards.js
          git commit -m "fix(api): bridge nested v1 routes through Vercel catch-all"
          git push origin HEAD:feat/summary-api-v1
