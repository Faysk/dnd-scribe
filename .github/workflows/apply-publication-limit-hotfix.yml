name: Apply local publication limit hotfix

on:
  push:
    branches:
      - fix/local-publication-million-segments

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Raise defensive segment ceiling
        shell: python
        run: |
          from pathlib import Path

          path = Path("api/[...path].js")
          text = path.read_text(encoding="utf-8")
          old = "if (rawSegments.length > 6000) throw httpError(400, 'A publicacao excede 6000 falas.');"
          new = "if (rawSegments.length > 1_000_000) throw httpError(400, 'A publicacao excede 1000000 falas.');"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one old publication limit, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Verify JavaScript syntax
        run: node --check 'api/[...path].js'

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet -- 'api/[...path].js'; then
            echo "No change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'api/[...path].js'
          git commit -m "fix(publication): allow up to one million local segments"
          git push origin HEAD:${GITHUB_REF_NAME}
