name: Temporary audit lockfile refresh

on:
  push:
    branches:
      - modernizacao/auditoria-final-100
    paths:
      - package.json
      - apps/web/package.json
      - .github/workflows/temp-refresh-audit-lockfiles.yml

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          ref: modernizacao/auditoria-final-100

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Refresh pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit refreshed lockfiles
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json pnpm-lock.yaml; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json pnpm-lock.yaml
          git commit -m "chore: refresh lockfiles for security patches"
          git push origin HEAD:modernizacao/auditoria-final-100
