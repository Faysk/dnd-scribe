name: Temporary API integration theme token fix

on:
  push:
    branches:
      - fix/api-integrations-theme-tokens

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/api-integrations-theme-tokens
          fetch-depth: 0
      - name: Fix integration theme tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/central-local/styles.css')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'background: var(--panel);': 'background: var(--paper-2);',
              'color: var(--gold-bright);': 'color: var(--acid);',
              '.api-key-empty strong { color: var(--paper); }': '.api-key-empty strong { color: var(--ink); }',
              '.api-key-meta strong { color: var(--paper-soft); font-weight: 650; }': '.api-key-meta strong { color: var(--ink); font-weight: 650; }',
              '  color: var(--paper);\n  background: var(--ink-soft);\n  border-radius: 8px;': '  color: var(--ink);\n  background: var(--paper-2);\n  border-radius: 8px;',
              '  background: var(--ink-soft);\n  border-radius: 9px;': '  background: var(--paper-2);\n  border-radius: 9px;',
              '.api-secret-warning strong { color: var(--paper); }': '.api-secret-warning strong { color: var(--ink); }',
              '.api-secret-value { min-height: 84px; resize: none; color: var(--gold-bright) !important; overflow-wrap: anywhere; }': '.api-secret-value { min-height: 84px; resize: none; color: var(--acid) !important; overflow-wrap: anywhere; }',
          }
          original = text
          for old, new in replacements.items():
              text = text.replace(old, new)
          if text == original:
              raise SystemExit(0)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix when needed
        shell: bash
        run: |
          if git diff --quiet -- web/central-local/styles.css; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/central-local/styles.css
          git commit -m "fix(ui): use local theme tokens in API integration dialogs"
          git push origin HEAD:fix/api-integrations-theme-tokens
