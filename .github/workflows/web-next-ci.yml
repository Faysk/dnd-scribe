name: Web Next CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-next-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-next-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Next bootstrap checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @dnd-scribe/web typecheck

      - name: Lint
        run: pnpm --filter @dnd-scribe/web lint

      - name: Unit tests
        run: pnpm --filter @dnd-scribe/web test

      - name: Build
        run: pnpm --filter @dnd-scribe/web build

      - name: Install Playwright Chromium
        run: pnpm --filter @dnd-scribe/web exec playwright install --with-deps chromium

      - name: E2E smoke
        run: pnpm --filter @dnd-scribe/web test:e2e
