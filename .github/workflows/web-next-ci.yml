name: Web Next CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-next-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-next-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Next quality and parity checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @dnd-scribe/web typecheck

      - name: Lint
        run: pnpm --filter @dnd-scribe/web lint

      - name: Unit tests
        run: pnpm --filter @dnd-scribe/web test

      - name: Build
        run: pnpm --filter @dnd-scribe/web build

      - name: Audit client bundle
        run: pnpm --filter @dnd-scribe/web audit:client-bundle

      - name: Measure client bundle
        run: pnpm --filter @dnd-scribe/web measure:client-bundle

      - name: Install Playwright browsers
        run: pnpm --filter @dnd-scribe/web exec playwright install --with-deps chromium firefox webkit

      - name: E2E parity smoke
        run: pnpm --filter @dnd-scribe/web test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
