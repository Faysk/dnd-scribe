name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

      - name: Build static frontend
        run: npm run build

      - name: Verify public output
        run: |
          test -s public/index.html
          test -s public/app.js
          test -s public/jobs.js
          test -s public/costs.js
          test -s public/monitoring.js
          test -s public/monitoring.css

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile Python tools
        run: python -m compileall -q tools local-companion/app local-companion/tests

  companion-tests:
    name: Companion regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install lightweight test dependencies
        run: python -m pip install 'fastapi==0.140.0' 'httpx>=0.28,<1' 'pytest>=8.4,<9' 'python-multipart==0.0.32'

      - name: Run companion tests
        env:
          PYTHONPATH: local-companion
        run: pytest -q local-companion/tests

      - name: Check local UI JavaScript syntax
        run: |
          node --check local-companion/static/app.js
          node --check local-companion/static/processing-v04.js
          node --check web/central-local/app.js
          node --check web/central-local/processing-v04.js
