name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      - name: Build operator surface
        run: pnpm build

      - name: Verify operator-only public output
        run: |
          test ! -e public/index.html
          test -s public/central-local/index.html
          test -s public/central-local/app.js
          test -s public/central-local/styles.css
          test -s public/roll20.html
          test -s public/api-docs.html
          test -s public/theme.js

  web-quality:
    name: Web quality and parity checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical web quality gate
        run: pnpm web:quality

      - name: Install Playwright browsers
        run: pnpm web:playwright:install

      - name: E2E parity smoke
        run: pnpm web:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile Python tools
        run: python -m compileall -q tools local-companion/app local-companion/tests

  companion-tests:
    name: Companion regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install lightweight test dependencies
        run: python -m pip install 'fastapi==0.140.0' 'httpx>=0.28,<1' 'pytest>=8.4,<9' 'python-multipart==0.0.32'

      - name: Run companion tests
        env:
          PYTHONPATH: local-companion
        run: pytest -q local-companion/tests

      - name: Check local UI JavaScript syntax
        run: |
          node --check local-companion/static/app.js
          node --check local-companion/static/processing-v04.js
          node --check web/central-local/app.js
          node --check web/central-local/processing-v04.js
