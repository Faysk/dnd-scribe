name: Apply session transcript auto-load UX

on:
  push:
    branches:
      - ux/session-transcript-auto-load

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python tools/_apply_session_auto_load_patch.py

      - name: Verify JavaScript syntax
        run: node --check web/library.js

      - name: Commit UX patch
        shell: bash
        run: |
          if git diff --quiet -- web/library.js web/library.css; then
            echo "No change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/library.js web/library.css
          git commit -m "feat(library): auto-load transcript while scrolling"
          git push origin HEAD:${GITHUB_REF_NAME}
