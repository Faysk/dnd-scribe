name: Apply summary API v1 patch

on:
  push:
    branches:
      - feat/summary-api-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply integration patch
        run: python tools/_apply_summary_api_v1_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Commit generated integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/[...path].js lib/summary-api.js web/central-local/index.html web/central-local/app.js web/central-local/styles.css vercel.json package.json
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "feat(api): wire summaries v1 and integration management"
          git push origin HEAD:feat/summary-api-v1
